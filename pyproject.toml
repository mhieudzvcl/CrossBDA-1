[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossbda"
version = "0.1.0"
description = "Cross-disaster building damage assessment research code"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "pyarrow>=14.0",
]

[tool.setuptools.packages.find]
include = ["crossbda*"]
